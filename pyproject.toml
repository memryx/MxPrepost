[build-system]
requires = [
    "setuptools>=61",
    "wheel",
    "pybind11~=2.13.6",
    "numpy~=1.26.4",
]
build-backend = "setuptools.build_meta"

[project]
name = "mxprepost"
version = "2.2.2"
description = "Optimized Pre/Post for models on MemryX MX3"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9,<3.13"
authors = [
    { name = "MemryX", email = "no-reply@memryx.com" },
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "opencv-python~=4.11.0",
    "numpy~=1.26.4",
]

[project.urls]
Homepage = "https://developer.memryx.com"
Repository = "https://github.com/memryx/mxprepost_pub"
Documentation = "https://developer.memryx.com/runtime/mxprepost.html"

[tool.setuptools]
license-files = ["LICENSE"]
